name: Régénération du site

# Se déclenche quand le gestionnaire /admin/ (ou un commit manuel) modifie
# le catalogue ou les photos produits. Régénère les fiches, la boutique et
# le sitemap, puis pousse le résultat — GitHub Pages redéploie ensuite seul.
# Pas de boucle possible : le commit du bot ne touche que des fichiers
# générés, qui ne sont pas dans les `paths` déclencheurs.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/produits/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les pages
        run: python3 scripts/generate_site.py

      - name: Publier si changements
        run: |
          git config user.name "nacrea-bot"
          git config user.email "actions@users.noreply.github.com"
          git add creation/ boutique.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "site : régénération automatique du catalogue"
            git push
          fi
